<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Avance Investor CMS</title>
  <link rel="shortcut icon" href="https://cdn.shopify.com/s/files/1/0636/5226/6115/files/AVANCE_LOGO.png?v=1743420448" type="image/x-icon">
  <link rel="stylesheet" href="assets/admin.css" />
</head>
<body>
  <div class="ad-login-wrap">
    <div class="ad-login-card">
      <img src="https://cdn.shopify.com/s/files/1/0636/5226/6115/files/AVANCE_LOGO.png?v=1743420448" alt="Avance Logo" class="ad-logo-img" />
      <h1>Investor CMS</h1>
      <p class="ad-subtitle">Sign in to manage compliance and investor documents</p>
      
      <div id="login-error" class="ad-alert error" hidden></div>
      
      <form id="login-form">
        <div class="ad-form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@avance.in" />
        </div>

        <div class="ad-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>

        <button type="submit" class="ad-btn primary">Sign In to Dashboard</button>
      </form>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
