<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Investor CMS...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const tabId = params.get("id");
    if (tabId) {
      window.location.replace(`tabs.html?id=${encodeURIComponent(tabId)}`);
    } else {
      window.location.replace("tabs.html");
    }
  </script>
</head>
<body style="background: #0a0a0f; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh;">
  <p>Redirecting to unified workspace...</p>
</body>
</html>
